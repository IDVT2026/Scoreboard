  <style>

    body {

      display: flex;

      align-items: center;

      padding: 24px;
      text-align: center;
    }
    .wrapper {

      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo {

      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #38bdf8;
      border-radius: 50%;

    .btn {

      align-items: center;
      gap: 8px;
      background: #0284c7;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
    .note {
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
